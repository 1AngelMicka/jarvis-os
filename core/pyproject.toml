[project]
name = "jarvis2"
version = "0.3.0"
description = "JARVIS 2 — Core (API, moteurs, mémoire)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastembed>=0.7",
    "tzdata>=2026.6",
    "webauthn>=2.2",
    "segno>=1.6",
    "numpy>=2.5.5",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
jarvis2 = "jarvis2.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis2"]

# Interface précompilée livrée dans le paquet : aucun Node chez l'utilisateur (construire avant : npm run build)
[tool.hatch.build.targets.wheel.force-include]
"../interface/dist" = "jarvis2/web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["base: test qui exige la base PostgreSQL de test (docker compose up -d)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographie française (espaces insécables, guillemets)
    "S101",                        # assert dans les tests
    "S603", "S607",                # sous-processus : la CLI claude est appelée sans shell, arguments en liste
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S608", "ASYNC240"]  # fixtures SQL constantes ; fichiers de test
"jarvis2/securite/*" = ["S608"]  # listes de colonnes constantes, valeurs toujours en paramètres $n

[tool.mypy]
python_version = "3.13"
strict = true
files = ["jarvis2", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sqlite_vec"]
ignore_missing_imports = true
