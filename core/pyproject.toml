[project]
name = "jarvis2"
version = "0.9.0"
description = "JARVIS 2 — assistant personnel local : Core (API, moteurs, mémoire) et interface web"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
keywords = ["assistant", "ia", "local", "mémoire", "vie privée"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastembed>=0.7",
    "tzdata>=2026.6",
    "webauthn>=2.2",
    "segno>=1.6",
    "numpy>=2.5.5",
    "sqlite-vec>=0.1.9",
    "pyyaml>=6.0.3",
    "croniter>=7.0.0",
    "faster-whisper>=1.2.1",
]

[project.scripts]
jarvis2 = "jarvis2.__main__:main"

[project.urls]
Accueil = "https://github.com/1AngelMicka/jarvis-os"
Source = "https://github.com/1AngelMicka/jarvis-os"
Suivi = "https://github.com/1AngelMicka/jarvis-os/issues"
Versions = "https://github.com/1AngelMicka/jarvis-os/releases"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
    "types-pyyaml>=6.0.12.20261113",
    "types-croniter>=6.2.4.20261118",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis2"]

# Interface précompilée, LICENSE et NOTICE livrés dans la roue distribuable (hatch_build.py) : aucun Node chez
# l'utilisateur. Sans interface compilée, la roue est construite sans elle (avertissement), sauf si
# JARVIS2_EXIGER_INTERFACE=1 (CI, publication).
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["base: test qui exige la base PostgreSQL de test (docker compose up -d)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographie française (espaces insécables, guillemets)
    "S101",                        # assert dans les tests
    "S603", "S607",                # sous-processus : la CLI claude est appelée sans shell, arguments en liste
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S608", "ASYNC240"]  # fixtures SQL constantes ; fichiers de test
"jarvis2/securite/*" = ["S608"]  # listes de colonnes constantes, valeurs toujours en paramètres $n
"jarvis2/commandes_rapides.py" = ["S608"]  # idem

[tool.mypy]
python_version = "3.13"
strict = true
files = ["jarvis2", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sqlite_vec", "faster_whisper", "av"]
ignore_missing_imports = true
