# Publication d'une version : roue du Core (interface incluse) et installeurs de l'application de bureau.
# Déclenchée par une étiquette « v* » (ou à la main). Le résultat est une version en BROUILLON : rien n'est public
# tant que le propriétaire du dépôt ne la publie pas depuis GitHub.
#
# Signatures (facultatives : sans elles, les installeurs sont construits mais non signés) :
# - TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) : signe les mises à jour de l'application (clé `tauri signer generate`,
#   créée par le propriétaire du dépôt sur son poste, jamais versionnée) ; la clé PUBLIQUE correspondante va dans
#   `plugins.updater.pubkey` de app/src-tauri/tauri.conf.json, ou dans la variable de dépôt TAURI_UPDATER_PUBKEY ;
# - WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD : certificat de signature de code Windows (PFX en base64) ;
# - APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID :
#   signature et notarisation macOS.
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roue:
    name: Roue du Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci && npm run build
        working-directory: interface
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir ../dist
        working-directory: core
        env:
          JARVIS2_EXIGER_INTERFACE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: roue
          path: dist/*.whl
      - name: Version en brouillon (roue et scripts d'installation)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "JARVIS $GITHUB_REF_NAME" --notes "Version en préparation."
          gh release upload "$GITHUB_REF_NAME" dist/*.whl install.ps1 install.sh --clobber

  application:
    name: Application (${{ matrix.plateforme }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - plateforme: windows-latest
          - plateforme: macos-latest
          - plateforme: ubuntu-22.04
    runs-on: ${{ matrix.plateforme }}
    steps:
      - uses: actions/checkout@v5
      - name: Bibliothèques système (Linux)
        if: matrix.plateforme == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: app
      # Un secret absent arriverait comme une chaîne vide, que Tauri prendrait pour un certificat : on ne
      # transmet que les secrets réellement configurés.
      - name: Signatures configurées
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<FIN_SECRET"; echo "${!v}"; echo "FIN_SECRET"; } >> "$GITHUB_ENV"
            fi
          done
      # Mise à jour automatique. `bundle.createUpdaterArtifacts` reste à false dans tauri.conf.json : à true, la
      # construction ÉCHOUE sans TAURI_SIGNING_PRIVATE_KEY (« A public key has been found, but no private key »), ce
      # qui casserait `npm run construire` en local et la CI sans secret. On ne l'active ici, par un fichier de
      # configuration fusionné (`--config`), que si la clé privée ET une clé publique existent. La clé publique est
      # prise dans tauri.conf.json, sinon dans la variable de dépôt TAURI_UPDATER_PUBKEY (injectée par le même
      # fichier, même sans clé privée, pour que le binaire publié sache vérifier les versions suivantes).
      - name: Mise à jour automatique (latest.json signé)
        shell: bash
        env:
          CLE_PUBLIQUE_DEPOT: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          fichier="$GITHUB_WORKSPACE/app/src-tauri/tauri.maj.conf.json"
          cle_fichier=$(node -p "require('./app/src-tauri/tauri.conf.json').plugins.updater.pubkey || ''")
          cle="${cle_fichier:-$CLE_PUBLIQUE_DEPOT}"
          signer=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$cle" ]; then
            signer=true
          elif [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY absent : pas de latest.json, la mise à jour automatique ne verra pas cette version"
          else
            echo "::warning::Clé publique de mise à jour absente (tauri.conf.json et vars.TAURI_UPDATER_PUBKEY) : pas de latest.json, la mise à jour automatique ne verra pas cette version"
          fi
          if [ "$signer" = true ] || { [ -z "$cle_fichier" ] && [ -n "$cle" ]; }; then
            CLE="$cle" SIGNER="$signer" node -e '
              const c = { plugins: { updater: { pubkey: process.env.CLE } } };
              if (process.env.SIGNER === "true") c.bundle = { createUpdaterArtifacts: true };
              require("fs").writeFileSync(process.argv[1], JSON.stringify(c));
            ' "$fichier"
            echo "ARGS_TAURI=--config $fichier" >> "$GITHUB_ENV"
          fi
          echo "MAJ_SIGNEE=$signer" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ env.ARGS_TAURI }}
          # latest.json (version, notes, adresse et signature par plateforme) déposé dans la version brouillon :
          # seulement quand les artefacts de mise à jour signés existent.
          includeUpdaterJson: ${{ env.MAJ_SIGNEE == 'true' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "JARVIS ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.plateforme }}
          path: |
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
