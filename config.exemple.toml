# Configuration locale de JARVIS 2 — exemple.
# Copier vers %APPDATA%\JARVIS2\config.toml (Windows) ou ~/.config/jarvis2/config.toml (Linux, macOS),
# ou indiquer un chemin avec la variable JARVIS2_CONFIG. Ce fichier n'est JAMAIS versionné : il contient ce qui
# vous est personnel (sujets exclus, données de tiers à écarter, requêtes de vérification).

[confidentialite]
# Sujets que JARVIS ne doit jamais aborder : toute phrase qui les nomme est retirée de la mémoire injectée au modèle.
# Expressions régulières, insensibles à la casse.
sujets_exclus = [
  # 'projet[\s_-]*secret',
]
# Sujets PRIVÉS : un message qui les nomme est confié à une IA locale par le routeur (il ne quitte pas le PC).
# Un souvenir « local_uniquement » qui répond au message a le même effet.
sujets_prives = [
  # '\bsant[ée]\b',
]

# --- Ateliers Claude Code (facultatif) : projets (dépôts git) où Claude Code peut travailler, un worktree par atelier ---
# Les commandes des ateliers tournent dans un bac à sable (Docker, Podman, Windows Sandbox, Bubblewrap, sandbox-exec),
# réseau coupé, seul le worktree monté. Image Docker/Podman utilisée (JARVIS ne la télécharge jamais : `docker pull`
# à faire vous-même ; il ne démarre jamais Docker non plus) :
# [ateliers]
# image_bac_a_sable = "python:3.13-slim"
#
# [[ateliers.projets]]
# id = "monsite"
# nom = "Mon site"
# chemin = "C:/Projets/monsite"
# Facultatif, pour l'amélioration continue : commande des tests du projet (sans shell, sans clé d'API) et sous-dossier
# où la lancer. Une amélioration n'est mise en service que si ces tests ont réussi sur le contenu exact de l'atelier.
# tests = "npm test"
# dossier_tests = ""
#
# Veille de VOS sessions Claude Code (lecture seule, à activer dans Ateliers ou Réglages › Appareils) : seul le
# dossier des fichiers d'état est lu (par défaut ~/.claude/sessions, ou CLAUDE_CONFIG_DIR/sessions), jamais vos
# conversations, jetons ou identifiants.
# [veille_claude_code]
# dossier = "C:/Users/moi/.claude/sessions"

# --- Agents (facultatif) ---
# Recettes planifiées : fichiers YAML dans le dossier « recettes » à côté de ce fichier (exemple : docs/recettes).
# Recherche web privée des missions : votre instance SearXNG (format JSON activé dans ses réglages).
# [recherche]
# searxng = "http://127.0.0.1:8888"
# Les missions de recherche interrogent aussi OpenAlex, arXiv, PubMed et Europe PMC (API publiques, sans clé ;
# seules les requêtes de la mission partent, jamais pour un sujet privé). Pour ne jamais les interroger :
# scientifique = false
# Accueil du matin : météo « à la maison » (Open-Meteo, sans clé). Lieu privé, jamais lu à voix haute ;
# la vue Système peut aussi le choisir (recherche d'une ville ou position de l'appareil).
# [matin]
# ville = "Votre ville"            # ou : latitude = 48.85 et longitude = 2.35
# Serveurs MCP : chaque outil reste inactif tant que vous ne l'activez pas (vue Agents), et chaque appel
# attend votre accord (🟡).
# [[mcp.serveurs]]
# id = "fichiers"
# commande = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/Documents/partage"]

# --- Connecteurs d'IA (facultatif) ---
# Modèle par défaut d'un connecteur, ou liste de modèles quand le fournisseur n'en publie pas (Codex).
# [connecteurs.ollama]
# modele = "qwen3.5:2b"
# modele_vision = "qwen3.5:2b"   # modèle Ollama qui voit les images (bouton « Écran », images jointes si le modèle choisi ne les voit pas)
# [connecteurs.codex]
# modeles = ["<modèle de votre compte>"]
# Point d'accès compatible OpenAI supplémentaire (clé : nom dans le coffre ; local = true pour un serveur du PC).
# [[connecteurs.compatibles]]
# id = "monserveur"
# nom = "Mon serveur"
# url = "http://192.168.1.20:8000/v1"
# local = true

# Tarifs ($ par million de jetons : entrée, sortie) pour estimer le coût des API qui ne le renvoient pas.
# [tarifs]
# "claude-sonnet-5-5" = [3.0, 15.0]

# Une section par source d'import (ici : JARVIS v1).
[import.jarvis_v1]
# Souvenirs dont la SOURCE correspond : jamais importés (ex. données de tiers).
exclure_sources = [
  # '^doc:export-messagerie',
]
# Souvenirs ou messages dont le CONTENU correspond : jamais importés.
exclure_contenus = []
# Requêtes témoins de `jarvis2 verifier-import jarvis_v1` (sinon, une liste générique est utilisée).
requetes_temoins = [
  # "Quels sont mes objectifs ?",
]

# Ressources et contrôle du PC (phase 13, lot J). Tout est facultatif.
[pc]
# Jeux détectés en plus des dossiers connus (Steam, Epic, Riot, Ubisoft, EA, GOG, Xbox) : nom de l'exécutable.
jeux = [
  # "monjeu.exe",
]
# Plan d'alimentation du mode Jeu (identifiant de `powercfg /list`) ; sinon le plan Performances de Windows.
# plan_jeu = "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"
# Arrêt de l'Ollama démarré par JARVIS après ce nombre de minutes sans modèle chargé.
ollama_inactivite_min = 20
